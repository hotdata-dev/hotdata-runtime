version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-name: hotdata

  # Action pins had no watcher, which is how gh-action-pypi-publish sat at
  # v1.13.0 until its bundled twine broke a release at upload time. Unlike the
  # uv entry there is no `allow` filter: the point is to see every stale pin,
  # not a chosen one.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
